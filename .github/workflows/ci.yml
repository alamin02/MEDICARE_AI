name: MedICARE AI CI Pipeline

on:
  push:
    branches: [ main, development, 'feature/**' ]
  pull_request:
    branches: [ main, development ]

jobs:
  frontend-check:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: cd client && npm ci

      - name: Run Type Check & Build
        run: cd client && npm run build

      - name: Execute Automated Frontend Tests
        run: node tests/frontend/test_frontend.js

  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r server/requirements.txt

      - name: Run Backend Unit Tests
        run: python -m unittest discover -s tests/backend -p "test_*.py"

      - name: Run Security Tests
        run: python -m unittest discover -s tests/security -p "test_*.py"
