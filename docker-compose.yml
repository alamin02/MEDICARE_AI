version: '3.8'

services:
  # MedICARE AI Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://medicare_user:medicare_pass@postgres:5432/medicare_db
      - SECRET_KEY=medicare-ai-production-secret-key-32-chars-min
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - medicare_network

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: medicare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medicare_user
      POSTGRES_PASSWORD: medicare_pass
      POSTGRES_DB: medicare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare_user -d medicare_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medicare_network

  # Qdrant Vector Database for Multimodal RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medicare_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - medicare_network

volumes:
  postgres_data:
  qdrant_data:

networks:
  medicare_network:
    driver: bridge
